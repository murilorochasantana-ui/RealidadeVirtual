<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>WebXR Bancada de Capacidades</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; overflow: hidden; background: #101015; }
      #app { position: fixed; inset: 0; z-index: 0; }

      /* Os dois painéis são <details>: recolhíveis sem depender de JS, com o
         resumo servindo de título. Quando abrem e fecham está em src/paineis.ts. */
      .painel {
        position: fixed;
        z-index: 100;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        color: #dde;
        background: rgba(10, 10, 22, 0.93);
        border: 1px solid rgba(79, 124, 255, 0.35);
        border-radius: 10px;
        backdrop-filter: blur(8px);
        overflow: hidden;
      }
      .painel > summary {
        display: block;
        min-height: 40px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        color: #6b9fff;
        cursor: pointer;
        list-style: none;
        user-select: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .painel > summary::-webkit-details-marker { display: none; }
      .painel > summary::before {
        content: '▸';
        display: inline-block;
        width: 1.1em;
      }
      .painel[open] > summary::before { content: '▾'; }
      .painel[open] > summary { border-bottom: 1px solid rgba(79, 124, 255, 0.25); }
      /* Recolhido, o diário não aparece: a marca avisa que há alerta ou falha nele. */
      #bancada.com-aviso > summary::after { content: ' ⚠'; color: #fbbf24; }

      #bancada {
        bottom: 16px;
        left: 16px;
      }
      #bancada[open] { width: min(540px, calc(100vw - 32px)); }

      #bancada-conteudo {
        display: flex;
        flex-direction: column;
        max-height: calc(80vh - 42px);
      }

      #diario {
        flex: none;
        background: rgba(5, 5, 15, 0.6);
        border-bottom: 1px solid rgba(79, 124, 255, 0.15);
        padding: 8px 12px;
        max-height: 110px;
        overflow-y: auto;
      }
      #diario:empty { display: none; }
      .diario { line-height: 1.5; padding: 1px 0; font-size: 12px; }
      .diario::before { margin-right: 6px; }
      .diario-nota   { color: #a0b4ff; }
      .diario-nota::before   { content: '›'; }
      .diario-alerta { color: #fbbf24; }
      .diario-alerta::before { content: '⚠'; }
      .diario-falha  { color: #f87171; }
      .diario-falha::before  { content: '✕'; }

      #corpo-relatorio {
        flex: 1 1 auto;
        min-height: 0;
        overflow-y: auto;
      }

      #relatorio-sem-sessao,
      #relatorio-sonda {
        padding: 12px 14px;
      }
      #relatorio-sem-sessao { border-bottom: 1px solid rgba(79,124,255,0.15); }
      #relatorio-sem-sessao:empty,
      #relatorio-sonda:empty { display: none; }

      #botao-sonda {
        display: block;
        width: calc(100% - 28px);
        margin: 10px 14px;
        padding: 10px;
        background: #4f7cff;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        text-align: center;
        min-height: 44px;
        transition: background 0.2s;
      }
      #botao-sonda:hover  { background: #3b63d4; }
      #botao-sonda:disabled { background: #444; cursor: wait; }

      #relatorio-sem-sessao h2,
      #relatorio-sonda h2 {
        font-size: 14px;
        color: #6b9fff;
        margin-bottom: 10px;
        padding-bottom: 5px;
        border-bottom: 1px solid rgba(79,124,255,0.25);
      }
      #relatorio-sem-sessao h3,
      #relatorio-sonda h3 {
        font-size: 11px;
        color: #8899cc;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 12px 0 5px;
      }
      #relatorio-sem-sessao p,
      #relatorio-sonda p {
        font-size: 12px;
        line-height: 1.55;
        margin-bottom: 4px;
      }
      #relatorio-sem-sessao table,
      #relatorio-sonda table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 6px;
        font-size: 12px;
      }
      #relatorio-sem-sessao th,
      #relatorio-sonda th {
        text-align: left;
        color: #667;
        font-weight: 600;
        font-size: 10px;
        text-transform: uppercase;
        padding: 3px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }
      #relatorio-sem-sessao td,
      #relatorio-sonda td {
        padding: 4px 6px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        vertical-align: top;
      }
      td.codigo {
        font-family: monospace;
        font-size: 11px;
        background: rgba(79,124,255,0.1);
        border-radius: 3px;
        white-space: nowrap;
      }

      #info {
        position: fixed;
        top: 12px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #fff;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        pointer-events: none;
        text-shadow: 0 1px 3px rgba(0,0,0,0.7);
        z-index: 10;
      }

      #painel-cena {
        top: 16px;
        right: 16px;
        font-size: 12px;
      }
      #painel-cena[open] { width: min(340px, calc(100vw - 32px)); }
      #painel-cena-conteudo {
        padding: 12px 14px;
        max-height: calc(70vh - 42px);
        overflow-y: auto;
      }
      #estrutura {
        white-space: pre;
        font-family: monospace;
        font-size: 11px;
        background: rgba(79, 124, 255, 0.08);
        border-radius: 6px;
        padding: 8px;
        margin-bottom: 10px;
        overflow-x: auto;
      }
      #botao-ancorar {
        width: 100%;
        padding: 8px;
        background: #4f7cff;
        color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
        min-height: 40px;
      }
      #botao-ancorar:hover { background: #3b63d4; }
      #botao-ancorar:disabled { background: #2f5a2f; cursor: default; }
      #diario-cena { margin-top: 8px; font-size: 11px; line-height: 1.5; }
      #diario-cena p { padding: 2px 0; color: #a0b4ff; }

      #dominio { padding: 12px 14px; border-bottom: 1px solid rgba(79,124,255,0.15); }
      #dominio h2 { font-size: 14px; color: #6b9fff; margin-bottom: 8px; }
      #dominio p { font-size: 12px; line-height: 1.5; margin-bottom: 4px; }

      body.em-sessao-xr #info { display: none; }

      /* Celular, em pé ou deitado: os títulos dos dois painéis ficam lado a lado
         no topo, sempre à vista, e o conteúdo aberto desce logo abaixo deles,
         com no máximo metade da altura da tela, para a bateria continuar
         visível. Aberto só cabe um por vez (src/paineis.ts, TELA_COMPACTA, que
         repete esta mesma condição). */
      @media (max-width: 640px), (max-height: 500px) {
        /* Sem backdrop-filter no painel: com ele, o painel viraria o bloco de
           contenção do conteúdo fixo, que ficaria preso dentro do título. */
        .painel { max-width: calc(50vw - 12px); backdrop-filter: none; }
        .painel > summary { padding: 10px 12px; font-size: 12px; }
        #bancada { top: 8px; bottom: auto; left: 8px; }
        #painel-cena { top: 8px; right: 8px; }
        #bancada[open],
        #painel-cena[open] { width: auto; }
        .painel[open] { border-color: #6b9fff; }
        .painel[open] > summary { border-bottom: none; }
        #bancada-conteudo,
        #painel-cena-conteudo {
          position: fixed;
          top: 56px;
          left: 8px;
          right: 8px;
          max-height: 50vh;
          max-height: 50dvh;
          background: rgba(10, 10, 22, 0.93);
          border: 1px solid rgba(79, 124, 255, 0.35);
          border-radius: 10px;
          backdrop-filter: blur(8px);
          overflow: hidden;
        }
        #painel-cena-conteudo { overflow-y: auto; }
        #diario { max-height: 72px; }
        #estrutura { max-height: 28vh; overflow-y: auto; }
        #info { top: 58px; padding: 0 12px; font-size: 12px; }
        body:has(.painel[open]) #info { visibility: hidden; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="info">Clique em <b>ENTER VR</b> ou <b>START AR</b>. No desktop, arraste para orbitar.</div>

    <details id="bancada" class="painel">
      <summary>Relatório</summary>
      <div id="bancada-conteudo">
        <div id="diario"></div>

        <div id="corpo-relatorio">
          <div id="dominio"></div>

          <div id="relatorio-sem-sessao"></div>

          <button id="botao-sonda">Sondar aparelho</button>

          <div id="relatorio-sonda"></div>
        </div>
      </div>
    </details>

    <details id="painel-cena" class="painel">
      <summary>Cena e ancoragem</summary>
      <div id="painel-cena-conteudo">
        <div id="estrutura"></div>
        <button id="botao-ancorar">Ancorar Tom na estante livre</button>
        <div id="diario-cena"></div>
      </div>
    </details>

    <script type="module" src="/src/main.ts"></script>

    <script type="module">
      import { iniciarSonda } from '/src/bancada/index.ts';
      iniciarSonda();
    </script>
  </body>
</html>
